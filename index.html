<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fruktur:ital@0;1&family=Story+Script&display=swap"
        rel="stylesheet">
    <title>Astraelion</title>
</head>

<body>
    <header class="pesquisa">
        <div class="btn-expandir">
            <button class="icon" id="btn-egitxp"><i class="bi bi-list"></i></button>
            <a href="#"><span class="txt-link"><i class="bi bi-stars"></i> Astrael<span
                        class="txt-particion">ion</span></span></a>
        </div>
        <div class="search-container">
            <form action="#" method="get" class="search-form">
                <input class="barra" type="search" id="Campo-buscar" placeholder="Explore um universo...">
                <button type="submit" class="btn-search"><i class="bi bi-search"></i></button>
            </form>
        </div>

        <div class="user-actions">
            <button class="btn-action"><i class="bi bi-layer-forward"></i></button>
            <button class="btn-action"><i class="bi bi-bell-fill"></i></button>
            <a href="#" class="user-link"><i class="bi bi-person-circle"></i></a>
        </div>
    </header>

    <nav class="menu-lateral">
        <div class="start-nav">
            <ul>
                <li class="item-menu ativo">
                    <a href="#">
                        <span class="icon"><i class="bi bi-house-door"></i></span>
                        <span class="txt-link">Inicio</span>
                    </a>
                </li>
            </ul>

            <ul>
                <li class="item-menu">
                    <a href="#">
                        <span class="icon"><i class="bi bi-bell"></i></span>
                        <span class="txt-link">Notificação</span>
                    </a>
                </li>
            </ul>

            <ul>
                <li class="item-menu">
                    <a href="#">
                        <span class="icon"><i class="bi bi-person"></i></span>
                        <span class="txt-link">Perfil</span>
                    </a>
                </li>
            </ul>
        </div>
        <div class="intermediaria">
            <ul class="item-menu">
                <a href="#">
                    <span class="txt-link-1">Canais</span>
                    <span class="icon-1"><i class="bi bi-plus"></i></span>
                </a>
            </ul>

            <ul>
                <li class="item-menu">
                    <a href="#">
                        <div class="Lity"></div>
                    </a>
                </li>
            </ul>
        </div>
        <div class="end-nav">
            <ul>
                <li class="item-menu">
                    <a href="#">
                        <span class="icon"><i class="bi bi-journals"></i></span>
                        <span class="txt-link">Historico</span>
                    </a>
                </li>
            </ul>

            <ul>
                <li class="item-menu">
                    <a href="#">
                        <span class="icon"><i class="bi bi-gear"></i></span>
                        <span class="txt-link">Configurações</span>
                    </a>
                </li>
            </ul>
        </div>
    </nav>


    <script src="scripts.js"></script>
</body>

</html>
