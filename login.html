<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/assets/css/login.css">
    <link rel="stylesheet" href="./assets/responsivo/login-responsivo.css" media="screen and (max-width: 1919px)">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Aldrich&family=Audiowide&family=DynaPuff:wght@400..700&family=Iceberg&display=swap" rel="stylesheet">
    <title>Astraelion - Login</title>
    <link rel="shortcut icon" href="./assets/img/logo.ico" type="image/ico">
</head>

<body>
    <section>
        <div class="slogan">
            <img src="./assets/img/logo.ico" alt="">
            <h1>Astrae<span>lion</span></h1>
            <h2>Entre em um novo universo</h2>
        </div>

        <form id="loginForm">
            <input type="email" id="email" placeholder="Digite seu e-mail">
            <input type="password" id="senha" placeholder="Digite sua senha">
            <a href="#">Esqueceu a senha?</a>

            <button class="btn-primary" type="button" onclick="validarLogin()">Entrar no Universo</button>
        </form>
        <hr>
        <div class="alternatives">
            <button>
                <i class="bi bi-google"></i>
                Google
            </button>

            <button>
                <i class="bi bi-discord"></i>
                Discord
            </button>

            <button>
                <i class="bi bi-github"></i>
                GitHub
            </button>
        </div>

        <div>
            <h4>Não possui uma conta? <a href="#">Criar conta </a></h4>
        </div>
    </section>
</body>
<script src="./assets/scripsts/login-scripts.js"></script>
</html>
