<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./assets/css/canal.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <title>Astraelion - Canal</title>
</head>

<body>

    <header>
        <nav>
            <div>

                    <button class="expandir">

                </div>
            </div>

            <form class="pesquisa">

                <button class="buscar">

                </button>
            </form>

            <div class="nav-perfil">
                <a href="#" class="btn-user">
                    <i class="bi bi-box-arrow-in-up"></i>
                </a>

                <a href="#" class="btn-user">
                    <i class="bi bi-bell"></i>
                </a>


                <a href="login.html" class="btn-user">
                    <i class="bi bi-person-circle"></i>
                </a>

            </div>
        </nav>
    </header>

    <aside class="menu-lateral">
        <div class="lis">
            <li>
                <a class="linha active" href="index.html">
                    <i class="bi bi-house-door-fill"></i>
                    <span class="name">Inicio</span>
                </a>
            </li>

            <li>
                <a class="linha" href="#">
                    <i class="bi bi-bell"></i>
                    <span class="name">Notificação</span>
                </a>
            </li>

            <li>
                <a class="linha" href="#">
                    <i class="bi bi-music-note-list"></i>

                </a>
            </li>
            <hr>

            <div>
                <span class="label-inscritos">
                    inscrições
                </span>
                <div class="label-list"></div>
            </div>

            <hr>

            <li>
                <a class="linha" href="#">
                    <i class="bi bi-clock-history"></i>
                    <span class="name">Historico</span>
                </a>
            </li>

            <li>
                <a class="linha" href="#">
                    <i class="bi bi-gear-fill"></i>
                    <span class="name">Configurações</span>
                </a>
            </li>
        </div>
    </aside>

    <main class="canal-container">

        <section class="cabecalho-canal">

            <div class="capa-canal">
                <img src="./assets/img/capa-canal.jpg" alt="Capa do canal">
            </div>

            <div class="informacoes-canal">

                <img class="avatar-canal" src="./assets/img/avatar1.jpg" alt="Canal Astraelion">

                <div class="dados-canal">

                    <h1>Canal Astraelion</h1>

                    <span class="usuario-canal">
                        @canalastraelion
                    </span>

                    <span class="inscritos-canal">

                    </span>

                </div>

                <div class="acoes-canal">

                    <button class="btn-inscrever">
                        Inscrever-se
                    </button>

                    <button class="btn-membros">
                        <i class="bi bi-star"></i>
                        Membros
                    </button>

                    <button class="btn-rede-social">
                        <i class="bi bi-plus-lg"></i>
                        Adicionar rede
                    </button>

                </div>

            </div>

            </div>

            <div class="descricao-canal">

                <p>
                    Explorando novos universos, histórias,
                    descobertas e tudo aquilo que existe além
                    das estrelas.
                </p>


            </div>

            <div class="categorias-canal">

    <button class="categoria active">
        Início
    </button>

    <button class="categoria">

    </button>

    <button class="categoria">

    </button>

    <button class="categoria">
        Playlists
