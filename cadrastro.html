<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./assets/css/cadastro.css">
    <link rel="stylesheet" href="./assets/responsivo/login-responsivo.css" media="screen and (max-width: 1780px)">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Aldrich&family=Audiowide&family=DynaPuff:wght@400..700&family=Iceberg&display=swap" rel="stylesheet">
    <title>Astraelion - Login</title>
    <link rel="shortcut icon" href="./assets/img/logo.ico" type="image/ico">
</head>

<body>
    <section>
        <div class="slogan">
            <img src="./assets/img/logo.ico" alt="">
            <h1>Astrae<span>lion</span></h1>
            <h2>Forje sua Chave e acesse o portal</h2>
        </div>

        <form id="cadastroForm">
            <!-- Campos adaptados para a temática -->
            <input type="text" id="nome" placeholder="Nome do Viajante (Nome completo)">
            <input type="email" id="email" placeholder="Frequência de Contato (Seu e-mail)">
            <input type="password" id="senha" placeholder="Código de Segurança da Chave (Senha)">
            <input type="password" id="confirmaSenha" placeholder="Confirme o Código da Chave">

            <!-- Botão com a temática de ativação -->
            <button class="btn-primary" type="button" onclick="validarCadastro()">
                <div class="portal-ring"></div>
                <div class="space-stars"></div>
                <span class="btn-text">Forjar Chave de Portal</span>
                <span class="btn-arrow">&rarr;</span>
            </button>
        </form>

        <hr>

        <div class="alternatives">
            <button>
                <i class="bi bi-google"></i>
                Google
            </button>

            <button>
                <i class="bi bi-discord"></i>
                Discord
            </button>

            <button>
                <i class="bi bi-github"></i>
                GitHub
            </button>
        </div>

        <div>
            <!-- Alternativa temática para voltar ao login -->
            <h4>Já possui uma Chave? <a href="login.html">Ativar Portal</a></h4>
        </div>
    </section>
</body>
<script src="./assets/scripsts/cadastro-scripts.js"></script>
</html>
