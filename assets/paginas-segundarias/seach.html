<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/assets/css/seach.css">
    <link rel="stylesheet" href="/assets/css/notificacao-global.css">
    <link rel="stylesheet" href="/assets/css/user-painel.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Aldrich&family=Audiowide&family=Iceberg&display=swap"
        rel="stylesheet">
    <title>Astraelion - Seach</title>
    <link rel="shortcut icon" href="/assets/img/logo.ico" type="image/ico">
</head>

<body>
    <header>
        <nav>
            <div>
                <div class="nav-conterner">
                    <button class="expandir">
                        <i class="bi bi-list"></i>
                    </button>
                    <img src="/assets/img/logo.ico" alt="img-logo">
                    <span>Astraelion</span>
                </div>
            </div>

            <form class="pesquisa">
    <input
        type="search"
        id="campoBusca"
        name="q"
        placeholder="Explorar..."
    >

    <button class="buscar" type="submit">
        <i class="bi bi-search"></i>
    </button>
</form>

            <div class="nav-perfil">
                <a href="#" class="btn-user">
                    <i class="bi bi-box-arrow-in-up"></i>
                </a>

                <a href="#" class="btn-user btn-notificacao">
                    <i class="bi bi-bell"></i>
                </a>

                <a href="#" class="btn-user-painel">
                    <i class="bi bi-person-circle"></i>
                </a>
            </div>
        </nav>
    </header>

    <aside class="menu-lateral">
        <div class="lis">
            <li>
                <a class="linha active" href="/index.html">
                    <i class="bi bi-house-door-fill"></i>
                    <span class="name">Inicio</span>
                </a>
            </li>

            <li>
                <a class="linha" href="/assets/paginas-segundarias/notificacao.html">
                    <i class="bi bi-bell"></i>
                    <span class="name">Notificação</span>
                </a>
            </li>

            <li>
                <a class="linha" href="#">
                    <i class="bi bi-music-note-list"></i>
                    <span class="name">PlayList</span>
                </a>
            </li>
            <hr>

            <div>
                <span class="label-inscritos">
                    inscrições
                </span>
                <div class="label-list"></div>
            </div>

            <hr>

            <li>
                <a class="linha" href="/assets/paginas-segundarias/historico.html">
                    <i class="bi bi-clock-history"></i>
                    <span class="name">Historico</span>
                </a>
            </li>

            <li>
                <a class="linha" href="/assets/paginas-segundarias/configuracoes.html">
                    <i class="bi bi-gear-fill"></i>
                    <span class="name">Configurações</span>
                </a>
            </li>
        </div>
    </aside>

    <main class="busca-container">

        <section class="cabecalho-busca">

            <h1>
                Resultados para:
                <span id="termo-busca">...</span>
            </h1>

            <div class="filtros-busca">

                <button class="filtro active" data-tipo="todos">
                    Todos
                </button>

                <button class="filtro" data-tipo="missao">
                    Missões
                </button>

                <button class="filtro" data-tipo="fenda">
                    Fendas
                </button>

                <button class="filtro" data-tipo="canal">
                    Canais
                </button>

                <button class="filtro" data-tipo="galaxia">
                    Galáxias
                </button>

            </div>

            <section class="resultados-busca" id="resultadosBusca">
            </section>

            <!-- Menu flutuante único para a página inteira -->
            <div id="menu-flutuante" class="dropdown-opcoes" style="display: none; position: absolute; z-index: 9999;">
                <button>
                    <i class="bi bi-plus-square"></i>
                    Salvar na playlist
                </button>
                <button>
                    <i class="bi bi-share"></i>
                    Compartilhar
                </button>
                <button>
                    <i class="bi bi-eye-slash"></i>
                    Não tenho interesse
                </button>
            </div>

        </section>

    </main>
</body>

<script src="/assets/scripsts/seach.js"></script>
<script src="/assets/scripsts/notificacao-global.js"></script>
<script src="/assets/scripsts/user-painel.js"></script>

</html>
