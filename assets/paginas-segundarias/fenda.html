<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/assets/css/fenda.css">
    <title>Document</title>
</head>
<body>
    <header>
        <nav>

                <div class="nav-conterner">
                    <button class="expandir">
                        <i class="bi bi-list"></i>

                </div>
            </div>

            <form class="pesquisa">
                <input type="search" placeholder="Explorar...">
                <button class="buscar">
                    <i class="bi bi-search"></i>
                </button>
            </form>

            <div class="nav-perfil">
                <a href="#" class="btn-user-postar">
                    <i class="bi bi-box-arrow-in-up"></i>
                </a>

                <a href="#" class="btn-user btn-notificacao">
                    <i class="bi bi-bell"></i>
                </a>

                <a href="#" class="btn-user-painel">
                    <i class="bi bi-person-circle"></i>
                </a>
            </div>
        </nav>
    </header>

    <aside class="menu-lateral">
        <div class="lis">
            <li>
                <a class="linha active" href="/index.html">
                    <i class="bi bi-house-door-fill"></i>
                    <span class="name">Inicio</span>
                </a>
            </li>

            <li>
                <a class="linha" href="/assets/paginas-segundarias/notificacao.html">
                    <i class="bi bi-bell"></i>
                    <span class="name">Notificação</span>
                </a>
            </li>

            <li>
                <a class="linha" href="#">
                    <i class="bi bi-music-note-list"></i>
                    <span class="name">PlayList</span>
                </a>
            </li>
            <hr>

            <div>
                <span class="label-inscritos">
                    inscrições
                </span>
                <div class="label-list"></div>
            </div>

            <hr>

            <li>
                <a class="linha" href="/assets/paginas-segundarias/historico.html">
                    <i class="bi bi-clock-history"></i>
                    <span class="name">Historico</span>
                </a>
            </li>

            <li>
                <a class="linha" href="/assets/paginas-segundarias/configuracoes.html">
                    <i class="bi bi-gear-fill"></i>
                    <span class="name">Configurações</span>
                </a>
            </li>
        </div>
    </aside>

 
    <main class="fendas-container">

    <section class="fenda-player">

        <div class="fenda-video">
            <img
                src="./assets/img/fenda1.jpg"
                alt="Fenda"
            >
        </div>

        <div class="fenda-acoes">

            <button type="button">
                <i class="bi bi-heart"></i>
            </button>

            <button type="button">
                <i class="bi bi-chat"></i>
            </button>

            <button type="button">
                <i class="bi bi-share"></i>
            </button>

        </div>

        <div class="fenda-info">

            <div class="fenda-canal">
                <span>@astraelion</span>
            </div>

            <h1>
                O que existe além da fenda?
            </h1>

            <p>
                Uma dimensão desconhecida acaba de ser encontrada.
            </p>

        </div>

    </section>

</main>

</html>
